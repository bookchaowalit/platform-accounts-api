# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounts-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      # The image runs 3.13, but the tests' embedded PostgreSQL (pgserver, dev extra) only ships
      # wheels up to cp312. Move to 3.13 once pgserver does.
      python-version: "3.12"
      # Ratchet: measured 60.98% on 2026-10-22 (threshold = measured - 2); raise it as tests grow.
      coverage-threshold: "58"

  accounts-metadata-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/accounts-metadata-api
      python-version: "3.12" # matches the python:3.12-slim image
      # Install is auto: `uv sync --frozen --all-extras` from this folder's uv.lock (the vendored
      # service-auth is a path source in it), the same lock the Dockerfile installs from.
      # The service's unittest suite under coverage.py (it leaves .coverage for the gate), then the
      # vendored service-auth suite, unmeasured: its code is covered in bookchaowalit/platform-auth-sdk.
      test-command: |
        python -m coverage run -m unittest discover -s tests -v
        (cd vendor/service-auth && python -m unittest discover -s tests -v)
      # Ratchet: measured 80.62% on 2026-10-22 (threshold = measured - 2); raise it as tests grow.
      coverage-threshold: "78"

  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: web
      node-version: "22"
      # No Biome/ESLint config yet: lint is skipped with a warning (follow-up).
      # Typecheck (`typecheck` script), Vitest (`test` script) and the Next.js build run.
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
