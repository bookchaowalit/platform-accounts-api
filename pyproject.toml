[project]
name = "solo-accounts"
version = "0.1.0"
description = "Accounts cell: its own API and database"
requires-python = ">=3.12"
dependencies = [
    # The cell toolkit (API, migrations, roles, publisher, MCP) from one pinned release.
    "platform-cellkit @ https://github.com/bookchaowalit/platform-cellkit/releases/download/v1.0.7/platform_cellkit-1.0.7-py3-none-any.whl",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    # [standard] = uvloop + httptools: +82% RPS in polyglot-benchmark-lab, and avoids the h11 Nagle stall
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
mcp = ["platform-cellkit[mcp]", "mcp>=2.3,<3"]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "pgserver>=0.1.4",
    "mcp>=2.3,<3",
    "mypy>=2.4",
    "types-PyYAML>=6",
]

[project.scripts]
accounts-mcp = "cellkit.mcp:main"
accounts-api = "cellkit.server:api"
accounts-publish = "cellkit.server:run_publish"
accounts-db = "cellkit.server:run_db"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
# The service's own code plus the platform-cellkit code its tests exercise (2026-11-12:
# the kit left src/; its own suite and 93% gate live in platform-cellkit).
source_pkgs = ["cellkit"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# CI runs `mypy .`: services/accounts-metadata-api is its own project (its own pyproject.toml
# and CI job), and web/ is TypeScript.
exclude = ["^services/", "^web/", "^build/"]
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# Service code: mypy --strict (the global-only strict flags are set above). tests/ stays gradual:
# its fixtures and test functions are unannotated, so mypy checks only their call sites.
[[tool.mypy.overrides]]
module = ["solo_accounts.*"]
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
warn_return_any = true
