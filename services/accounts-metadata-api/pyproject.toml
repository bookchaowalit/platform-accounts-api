[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-accounts-api"
version = "0.1.0"
description = "Read-only projection of the Solo Empire account matrix"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
    "solo-empire-service-auth>=0.1.0,<0.2",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
# The suite is the standard library's unittest; coverage.py measures it for the CI coverage gate.
dev = ["coverage>=7", "mypy>=2.4", "types-PyYAML>=6"]

[tool.setuptools]
py-modules = ["server", "_sentry"]

# solo-empire-service-auth is not on PyPI: it is the vendored copy of bookchaowalit/platform-auth-sdk.
[tool.uv.sources]
solo-empire-service-auth = { path = "vendor/service-auth" }

[tool.coverage.run]
# This service's own modules; the vendored service-auth is measured in its own repository.
source = ["."]
omit = ["tests/*", "vendor/*", ".venv/*"]

[tool.mypy]
python_version = "3.12"
files = ["server.py", "_sentry.py", "tests"]
exclude = ["^vendor/", "^build/"]
# The vendored service-auth ships no py.typed marker; read its (annotated) source instead.
mypy_path = "vendor/service-auth"
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# Service code: mypy --strict (the global-only strict flags are set above). tests/ stays gradual.
[[tool.mypy.overrides]]
module = ["server", "_sentry"]
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
warn_return_any = true

# The vendored copy is checked (and kept byte-identical) in bookchaowalit/platform-auth-sdk.
[[tool.mypy.overrides]]
module = ["service_auth", "service_auth.*"]
ignore_errors = true
