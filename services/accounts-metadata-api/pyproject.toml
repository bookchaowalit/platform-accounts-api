[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-accounts-api"
version = "0.1.0"
description = "Read-only projection of the Solo Empire account matrix"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
    "solo-empire-service-auth>=0.1.0,<0.2",
    "sentry-sdk>=2.72,<3",
]

[tool.setuptools]
py-modules = ["server", "_sentry"]
